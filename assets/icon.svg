<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- Graphite mark, transparent ground. Same geometry as the designer
       master (icon-tile.svg) but the #f3f2f2 ground is dropped and the
       half-unit separators are cut through via masks instead of painted. -->
  <defs>
    <mask id="cut1">
      <rect x="0" y="0" width="24" height="24" fill="#fff"></rect>
      <rect x="6.5" y="6.5" width="11" height="11" fill="#000"></rect>
    </mask>
    <mask id="cut2">
      <rect x="0" y="0" width="24" height="24" fill="#fff"></rect>
      <rect x="9.5" y="9.5" width="11" height="11" fill="#000"></rect>
    </mask>
  </defs>
  <rect x="4" y="4" width="10" height="10" fill="#cfcdcc" mask="url(#cut1)"></rect>
  <rect x="7" y="7" width="10" height="10" fill="#918e8c" mask="url(#cut2)"></rect>
  <rect x="10" y="10" width="10" height="10" fill="#201e1d"></rect>
</svg>
